# Bootstrap-конфиг RatHole server.
# ВНИМАНИЕ: этот файл ПЕРЕЗАПИСЫВАЕТСЯ control-plane'ом при каждом create/delete туннеля.
# Ручные правки теряются после первой же синхронизации из БД.
[server]
